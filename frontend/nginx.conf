# WHY: Nginx configuration for serving React SPA
# Handles client-side routing by redirecting all routes to index.html

server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # WHY: Enable gzip compression for better performance
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # WHY: Cache static assets for better performance
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # WHY: Serve index.html for all routes (SPA routing)
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # WHY: Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
